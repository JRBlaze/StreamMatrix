<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Watch Twitch, Kick, and YouTube live streams together.">
    <title>StreamMatrix</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/" aria-label="StreamMatrix home">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
        <span>Stream<span>Matrix</span></span>
      </a>

      <div class="header-actions">
        <button class="button button-quiet mute-all-button" id="mute-all-button" type="button" aria-pressed="false">
          <svg class="volume-on-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a4 4 0 0 1 0 6m2.5-8.5a8 8 0 0 1 0 11"/>
          </svg>
          <svg class="volume-off-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M11 5 6 9H3v6h3l5 4V5Zm5 5 5 5m0-5-5 5"/>
          </svg>
          <span>Mute all</span>
        </button>
        <button class="button button-quiet desktop-only" id="accounts-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0"/></svg>
          Sign in
        </button>
        <div class="popover account-popover" id="accounts-popover" hidden>
          <p>Sign in on each platform to use your account in supported embeds.</p>
          <a href="https://www.twitch.tv/login" target="_blank" rel="noreferrer">Twitch <span>&nearr;</span></a>
          <a href="https://kick.com/" target="_blank" rel="noreferrer">Kick <span>&nearr;</span></a>
          <a href="https://accounts.google.com/ServiceLogin?service=youtube" target="_blank" rel="noreferrer">YouTube <span>&nearr;</span></a>
        </div>

        <label class="theme-control" aria-label="Color theme">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2m-2.64-7.36-1.42 1.42M7.05 16.95l-1.41 1.41m12.72 0-1.42-1.41M7.05 7.05 5.64 5.64M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
          <select id="theme-select">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>

        <button class="icon-button mobile-only" id="mobile-menu-button" type="button" aria-label="Open menu">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="toolbar" aria-labelledby="add-stream-title">
        <div class="toolbar-copy">
          <h1 id="add-stream-title">Your live matrix</h1>
          <p>Bring every stream into one view.</p>
        </div>

        <form class="add-form" id="add-stream-form">
          <label class="select-wrap">
            <span class="sr-only">Platform</span>
            <select id="platform-select" name="platform" aria-label="Streaming platform">
              <option value="twitch">Twitch</option>
              <option value="kick">Kick</option>
              <option value="youtube">YouTube</option>
            </select>
          </label>
          <label class="stream-input-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
            <span class="sr-only">Streamer username</span>
            <input
              id="stream-input"
              name="stream"
              autocomplete="off"
              placeholder="Enter Twitch username"
              required
            >
          </label>
          <button class="button button-primary" id="add-stream-button" type="submit">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            Add stream
          </button>
        </form>

        <div class="toolbar-options">
          <label class="switch-label">
            <input id="chat-toggle" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
            Show live chat
          </label>
          <span class="stream-count" id="stream-count">0 streams</span>
        </div>
        <p class="form-message" id="form-message" role="status" hidden></p>
      </section>

      <div class="workspace" id="workspace">
        <section class="stream-grid" id="stream-grid" aria-live="polite"></section>

        <aside class="chat-panel" id="chat-panel" aria-label="Live chat" hidden>
          <div class="chat-header">
            <div>
              <span class="eyebrow">Live chat</span>
              <label>
                <span class="sr-only">Choose chat</span>
                <select id="chat-select"></select>
              </label>
            </div>
            <button class="icon-button" id="close-chat-button" type="button" aria-label="Close live chat">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="chat-frame-wrap" id="chat-frame-wrap"></div>
          <a class="chat-external-link" id="chat-external-link" target="_blank" rel="noreferrer">
            Open chat on platform
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 5h5v5m0-5-9 9M19 13v6H5V5h6"/></svg>
          </a>
        </aside>
      </div>
    </main>

    <template id="empty-state-template">
      <div class="empty-state">
        <div class="empty-visual" aria-hidden="true">
          <div class="empty-screen screen-one"><span></span></div>
          <div class="empty-screen screen-two"><span></span></div>
          <div class="empty-screen screen-three"><span></span></div>
          <div class="signal signal-one"></div>
          <div class="signal signal-two"></div>
        </div>
        <h2>Build your matrix</h2>
        <p>Add a Twitch, Kick, or YouTube channel above to start watching.</p>
        <div class="platform-pills" aria-label="Supported platforms">
          <span class="platform-pill twitch">Twitch</span>
          <span class="platform-pill kick">Kick</span>
          <span class="platform-pill youtube">YouTube</span>
        </div>
      </div>
    </template>

    <template id="stream-card-template">
      <article class="stream-card">
        <div class="player-wrap">
          <div class="player-loading"><span></span>Loading stream...</div>
        </div>
        <footer class="stream-meta">
          <span class="platform-dot"></span>
          <div>
            <strong class="stream-name"></strong>
            <span class="stream-platform"></span>
          </div>
          <button class="icon-button chat-card-button" type="button" aria-label="Show this stream's chat">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3v-6a3 3 0 0 1-1-2V7a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3v8Z"/></svg>
          </button>
          <button class="icon-button remove-stream-button" type="button" aria-label="Remove stream">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </footer>
      </article>
    </template>
  </body>
</html>
